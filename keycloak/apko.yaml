annotations:
  org.opencontainers.image.licenses: Apache-2.0
  org.opencontainers.image.description: "Open Source Identity and Access Management For Modern Applications and Services."
  org.opencontainers.image.documentation: https://www.keycloak.org/documentation
  org.opencontainers.image.source: https://github.com/keycloak/keycloak
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - busybox
    - libcrypt1
    - libxcrypt
    - keycloak-darkfellanet=26.4.7-r1
    - keycloak-darkfellanet-compat=26.4.7-r1
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: 65532:65532
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  KC_RUN_IN_CONTAINER: true
  KC_HEALTH_ENABLED: true
  KC_METRICS_ENABLED: true
  KC_DB: postgres
entrypoint:
  command: /opt/keycloak/bin/kc.sh
