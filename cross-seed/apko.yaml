annotations:
  org.opencontainers.image.licenses: Apache-2.0
  org.opencontainers.image.description: "Fully-automatic cross-seeding with Torznab."
  org.opencontainers.image.documentation: https://www.cross-seed.org/docs/basics/getting-started
  org.opencontainers.image.source: https://github.com/cross-seed/cross-seed
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - cross-seed=6.13.6-r0
    - catatonit
    - tzdata
work-dir: /usr/lib/cross-seed
volumes: ["/config"]
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  CONFIG_DIR: /config
  DOCKER_ENV: true
entrypoint:
  command: catatonit -- node dist/cmd.js
