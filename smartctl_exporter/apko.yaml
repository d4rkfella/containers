annotations:
  org.opencontainers.image.licenses: Apache-2.0
  org.opencontainers.image.description: "Export smartctl statistics to prometheus."
  org.opencontainers.image.source: https://github.com/prometheus-community/smartctl_exporter
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - smartctl_exporter
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
entrypoint:
  command: smartctl_exporter
