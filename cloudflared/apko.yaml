annotations:
  org.opencontainers.image.licenses: Apache-2.0
  org.opencontainers.image.description: "Cloudflare Tunnel client (formerly Argo Tunnel)"
  org.opencontainers.image.documentation: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/
  org.opencontainers.image.source: https://github.com/cloudflare/cloudflared
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - cloudflared=2025.11.1-r1
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
entrypoint:
  command: cloudflared --no-autoupdate
cmd: version
