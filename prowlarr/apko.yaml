annotations:
  org.opencontainers.image.licenses: GPL-3.0-or-later
  org.opencontainers.image.description: "Prowlarr is an indexer manager/proxy built on the popular *arr .net/reactjs base stack to integrate with your various PVR apps, supporting management of both Torrent Trackers and Usenet Indexers."
  org.opencontainers.image.documentation: https://wiki.servarr.com/en/prowlarr
  org.opencontainers.image.source: https://github.com/Prowlarr/Prowlarr
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - prowlarr
    - catatonit
    - tzdata
work-dir: /config
volumes: ["/config"]
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
  XDG_CONFIG_HOME: "/config"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_EnableDiagnostics: "0"
  PROWLARR__UPDATE__BRANCH: "develop"
entrypoint:
  command: catatonit -- Prowlarr
cmd: --nobrowser
