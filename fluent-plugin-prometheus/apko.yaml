contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-base
    - fluent-plugin-prometheus=2.2.1-r0
    - fluent-plugin-grafana-loki=1.2.20-r0

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
  run-as: nonroot

paths:
  - path: /fluentd/etc
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /fluentd/log
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
