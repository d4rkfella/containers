annotations:
  org.opencontainers.image.licenses: MIT
  org.opencontainers.image.description: "This tool will help manage tedious tasks in qBittorrent and automate them. Tag, categorize, remove Orphaned data, remove unregistered torrents and much much more."
  org.opencontainers.image.documentation: https://github.com/StuffAnThings/qbit_manage/wiki
  org.opencontainers.image.source: https://github.com/StuffAnThings/qbit_manage
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - busybox
    - catatonit
    - tzdata
    - qbit_manage=4.6.5-r1
work-dir: /usr/lib/qbitmanage/app
volumes: ["/config"]
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/lib/qbitmanage/app/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1
entrypoint:
  command: catatonit -- python qbit_manage.py
