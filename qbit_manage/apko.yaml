contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - busybox
    - catatonit
    - tzdata
    - qbit_manage

work-dir: /usr/lib/qbitmanage/app
volumes: [ "/config" ]
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/lib/qbitmanage/app/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1
  UMASK: "0002"
  TZ: "Etc/UTC"
entrypoint: 
  command:
   catatonit -- python qbit_manage.py
