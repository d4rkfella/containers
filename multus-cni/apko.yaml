annotations:
  org.opencontainers.image.licenses: Apache-2.0
  org.opencontainers.image.description: "A CNI meta-plugin for multi-homed pods in Kubernetes."
  org.opencontainers.image.documentation: https://k8snetworkplumbingwg.github.io/multus-cni/docs/how-to-use.html
  org.opencontainers.image.source: https://github.com/k8snetworkplumbingwg/multus-cni
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - multus-cni-darkfellanet=4.2.3-r1
    - multus-cni-darkfellanet-compat=4.2.3-r1
accounts:
  run-as: root:root
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
entrypoint:
  command: /thin_entrypoint
