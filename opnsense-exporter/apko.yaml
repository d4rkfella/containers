annotations:
  org.opencontainers.image.licenses: Apache-2.0
  org.opencontainers.image.description: "OPNsense Exporter for Prometheus."
  org.opencontainers.image.source: https://github.com/AthennaMind/opnsense-exporter
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - opnsense-exporter=0.0.14-r0
    - tzdata
    - catatonit
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  TZ: "Etc/UTC"
entrypoint:
  command: catatonit -- opnsense-exporter
