annotations:
  org.opencontainers.image.licenses: GPL-3.0-or-later
  org.opencontainers.image.description: "Smart PVR for newsgroup and bittorrent users."
  org.opencontainers.image.documentation: https://wiki.servarr.com/en/sonarr
  org.opencontainers.image.source: https://github.com/Sonarr/Sonarr
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - tzdata
    - sonarr
    - catatonit
work-dir: /config
volumes: ["/config"]
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
  XDG_CONFIG_HOME: "/config"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_EnableDiagnostics: "0"
entrypoint:
  command: catatonit -- Sonarr
cmd: --nobrowser
