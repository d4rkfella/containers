annotations:
  org.opencontainers.image.licenses: PostgreSQL
  org.opencontainers.image.description: "pgAdmin is the most popular and feature rich Open Source administration and development platform for PostgreSQL, the most advanced Open Source database in the world."
  org.opencontainers.image.documentation: https://www.pgadmin.org/docs/pgadmin4/latest/index.html
  org.opencontainers.image.source: https://github.com/pgadmin-org/pgadmin4
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - tzdata
    - pgadmin4=9.13-r6
    - catatonit
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
  PYTHONPATH: /usr/lib/pgadmin4
volumes:
  - /var/lib/pgadmin
entrypoint:
  command: /usr/bin/catatonit -- /usr/lib/pgadmin4/venv/bin/python3.13 -m gunicorn -c /usr/lib/pgadmin4/gunicorn_config.py run_pgadmin:app
