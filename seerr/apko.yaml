annotations:
  org.opencontainers.image.licenses: MIT
  org.opencontainers.image.description: "Open-source media request and discovery manager for Jellyfin, Plex, and Emby."
  org.opencontainers.image.documentation: https://docs.seerr.dev/
  org.opencontainers.image.source: https://github.com/seerr-team/seerr
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - catatonit
    - seerr=3.1.0-r0
    - tzdata
work-dir: /usr/lib/seerr
volumes: ["/config"]
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
  NODE_ENV: "production"
entrypoint:
  command: catatonit -- node dist/index.js
