annotations:
  org.opencontainers.image.licenses: Apache-2.0
  org.opencontainers.image.description: "Kubernetes controller for GitHub Actions self-hosted runners."
  org.opencontainers.image.documentation: https://docs.github.com/en/actions/concepts/runners/actions-runner-controller
  org.opencontainers.image.source: https://github.com/actions/actions-runner-controller
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - actions-runner-controller=0.14.0-r2
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
entrypoint:
  command: manager
