annotations:
  org.opencontainers.image.title: "Actions Runner Controller"
  org.opencontainers.image.description: "Kubernetes controller for GitHub Actions self-hosted runners"
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - actions-runner-controller=0.12.0-r0
    - actions-runner-controller-compat=0.12.0-r0
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
entrypoint:
  command: /manager
