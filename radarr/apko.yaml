annotations:
  org.opencontainers.image.licenses: GPL-3.0-or-later
  org.opencontainers.image.description: "Movie organizer/manager for usenet and torrent users."
  org.opencontainers.image.documentation: https://wiki.servarr.com/en/radarr
  org.opencontainers.image.source: https://github.com/Radarr/Radarr
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - radarr=6.0.3.10276-r0
    - catatonit
    - tzdata
work-dir: /config
volumes: ["/config"]
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  XDG_CONFIG_HOME: /config
  DOTNET_RUNNING_IN_CONTAINER: true
  DOTNET_EnableDiagnostics: 0
  RADARR__UPDATE__BRANCH: develop
entrypoint:
  command: catatonit -- Radarr
cmd: --nobrowser
