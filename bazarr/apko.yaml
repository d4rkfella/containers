annotations:
  org.opencontainers.image.licenses: GPL-3.0-or-later
  org.opencontainers.image.description: "Bazarr is a companion application to Sonarr and Radarr. It manages and downloads subtitles based on your requirements. You define your preferences by TV show or movie and Bazarr takes care of everything for you."
  org.opencontainers.image.documentation: https://wiki.bazarr.media/
  org.opencontainers.image.source: https://github.com/morpheus65535/bazarr
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - catatonit
    - tzdata
    - bazarr=1.5.7_beta7-r0
work-dir: /usr/lib/bazarr/app
volumes: ["/config"]
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/lib/bazarr/app/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1
entrypoint:
  command: catatonit -- python bazarr.py
cmd: --no-update --config /config
