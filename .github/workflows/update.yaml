name: Check for Package Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight

jobs:
  generate_matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Matrix
        id: generate
        run: |
          APP_LIST=$(find . -type f -name 'apko.yaml' ! -path '*/.*/*' -exec dirname {} \; | sed 's|^\./||' | sort -u)
          MATRIX_JSON=$(echo "$APP_LIST" | jq -R -s --compact-output 'split("\n") | map(select(length > 0)) | {include: map({name: .})}')
          echo "Generated matrix (compact):"
          echo "$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  check_and_update_package:
    needs: generate_matrix
    runs-on: ubuntu-latest
    if: needs.generate_matrix.outputs.matrix != '{}' && needs.generate_matrix.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create update script
        run: |
          cat > update_script.sh << 'EOSCRIPT'
          #!/usr/bin/ash
          set -e

          apk add yq curl coreutils
          
          echo "https://packages.darkfellanetwork.com/wolfi-os" >> /etc/apk/repositories
          curl -sL https://packages.darkfellanetwork.com/wolfi-os/melange.rsa.pub -o /etc/apk/keys/melange.rsa.pub
          
          apk update
          
          APKO_FILE="${{ matrix.name }}/apko.yaml"
          APP_NAME="${{ matrix.name }}"

          echo "Checking for updates in $APP_NAME"
          echo "file_modified=false" >> "$GITHUB_OUTPUT"

          # Get pinned packages and handle multi-line output properly
          PINNED_PACKAGES=$(yq e ".contents.packages[] | select(test(\"=\"))" "$APKO_FILE" || echo "")
          if [ -z "$PINNED_PACKAGES" ]; then
            echo "No pinned packages found in $APKO_FILE."
            exit 0
          fi

          # Process each package (ash-compatible loop)
          UPDATED_PACKAGES=""
          echo "$PINNED_PACKAGES" | while read -r PACKAGE_PIN_LINE; do
            PACKAGE_NAME=$(echo "$PACKAGE_PIN_LINE" | cut -d= -f1)
            CURRENT_VERSION=$(echo "$PACKAGE_PIN_LINE" | cut -d= -f2)

            case "$PACKAGE_NAME" in
              *"$APP_NAME"*)
                echo "Checking updates for $PACKAGE_NAME"
                LATEST_FULL_STRING=$(apk search --exact "$PACKAGE_NAME" | grep -v "^fetch" | head -n 1 || true)
                LATEST_VERSION=$(echo "$LATEST_FULL_STRING" | sed "s/^${PACKAGE_NAME}-//" || true)

                if [ -z "$LATEST_VERSION" ]; then
                  echo "No version info found for $PACKAGE_NAME"
                  continue
                fi

                if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
                  echo "Updating $PACKAGE_NAME from $CURRENT_VERSION to $LATEST_VERSION"
                  yq e "(.contents.packages[] | select(. == \"$PACKAGE_NAME=$CURRENT_VERSION\")) = \"$PACKAGE_NAME=$LATEST_VERSION\"" -i "$APKO_FILE"
                  UPDATED_PACKAGES="${UPDATED_PACKAGES}${PACKAGE_NAME}=${LATEST_VERSION}\n"
                  echo "file_modified=true" >> "$GITHUB_OUTPUT"
                else
                  echo "$PACKAGE_NAME is already up-to-date"
                fi
                ;;
            esac
          done

          if [ -n "$UPDATED_PACKAGES" ]; then
            echo "Updated packages:"
            printf "%b" "$UPDATED_PACKAGES"
            echo "updated_packages<<EOF" >> "$GITHUB_OUTPUT"
            printf "%b" "$UPDATED_PACKAGES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "No updates available for $APP_NAME"
          fi
          EOSCRIPT
          chmod +x update_script.sh

      - name: Check and update pinned package
        id: check_update
        uses: docker://cgr.dev/chainguard/wolfi-base:latest
        with:
          entrypoint: /usr/bin/ash
          args: ./update_script.sh
      
      - name: Create Pull Request
        if: steps.check_update.outputs.file_modified == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          title: 'Update "${{ matrix.name }}" version to "${{ steps.check_update.outputs.latest_version }}"'
          add-paths: "${{ matrix.name }}/apko.yaml"
          branch: 'update-${{ matrix.name }}-${{ steps.check_update.outputs.latest_version }}'
          commit-message: 'Update ${{ matrix.name }} version to ${{ steps.check_update.outputs.latest_version }}'
          sign-commits: true
