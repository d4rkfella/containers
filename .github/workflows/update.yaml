name: Check for Package Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight

jobs:
  generate_matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Matrix
        id: generate
        run: |
          APP_LIST=$(find . -type f -name 'apko.yaml' ! -path '*/.*/*' -exec dirname {} \; | sed 's|^\./||' | sort -u)
          MATRIX_JSON=$(echo "$APP_LIST" | jq -R -s --compact-output 'split("\n") | map(select(length > 0)) | {include: map({name: .})}')
          echo "Generated matrix (compact):"
          echo "$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  check_and_update_package:
    needs: generate_matrix
    runs-on: ubuntu-latest
    if: needs.generate_matrix.outputs.matrix != '{}' && needs.generate_matrix.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create update script
        run: |
          cat > update_script.sh << 'EOSCRIPT'
          #!/usr/bin/ash
          set -e

          apk add yq curl coreutils
          
          echo "https://packages.darkfellanetwork.com/wolfi-os" >> /etc/apk/repositories
          curl -sL https://packages.darkfellanetwork.com/wolfi-os/melange.rsa.pub -o /etc/apk/keys/melange.rsa.pub
          
          apk update
          
          APKO_FILE="${{ matrix.name }}/apko.yaml"
          APP_NAME="${{ matrix.name }}"

          echo "file_modified=false" >> "$GITHUB_OUTPUT"
          echo "latest_version=" >> "$GITHUB_OUTPUT"

          # Create temp files
          TMP_UPDATES=$(mktemp)
          TMP_VERSIONS=$(mktemp)
          TMP_COUNT=$(mktemp)
          echo "0" > "$TMP_COUNT"
          TMP_MATCHED=$(mktemp)
          echo "0" > "$TMP_MATCHED"

          PINNED_PACKAGES=$(yq e ".contents.packages[] | select(test(\"=\"))" "$APKO_FILE" || echo "")
          if [ -z "$PINNED_PACKAGES" ]; then
            echo "ℹ️ No pinned packages found in $APKO_FILE"
            exit 0
          fi

          echo "$PINNED_PACKAGES" | while read -r PACKAGE_PIN_LINE; do
            PACKAGE_NAME=$(echo "$PACKAGE_PIN_LINE" | cut -d= -f1)
            CURRENT_VERSION=$(echo "$PACKAGE_PIN_LINE" | cut -d= -f2)

            case "$PACKAGE_NAME" in
              *"$APP_NAME"*)
                # Increment matched packages count
                MATCHED=$(cat "$TMP_MATCHED")
                echo $((MATCHED + 1)) > "$TMP_MATCHED"

                LATEST_FULL_STRING=$(apk search --exact "$PACKAGE_NAME" | grep -v "^fetch" | head -n 1 || true)
                LATEST_VERSION=$(echo "$LATEST_FULL_STRING" | sed "s/^${PACKAGE_NAME}-//" || true)

                if [ -z "$LATEST_VERSION" ]; then
                  echo "⚠️  Version check failed for $PACKAGE_NAME"
                  continue
                fi

                echo "$LATEST_VERSION" >> "$TMP_VERSIONS"

                if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
                  echo "🔄 Updating $PACKAGE_NAME: $CURRENT_VERSION → $LATEST_VERSION"
                  yq e "(.contents.packages[] | select(. == \"$PACKAGE_NAME=$CURRENT_VERSION\")) = \"$PACKAGE_NAME=$LATEST_VERSION\"" -i "$APKO_FILE"
                  echo "${PACKAGE_NAME}=${LATEST_VERSION}" >> "$TMP_UPDATES"
                  echo "file_modified=true" >> "$GITHUB_OUTPUT"
                  # Increment update count
                  COUNT=$(cat "$TMP_COUNT")
                  echo $((COUNT + 1)) > "$TMP_COUNT"
                fi
                ;;
            esac
          done

          # Get final counts
          UPDATED_COUNT=$(cat "$TMP_COUNT")
          MATCHED_COUNT=$(cat "$TMP_MATCHED")

          # Get the most recent version for PR title
          if [ -s "$TMP_VERSIONS" ]; then
            LATEST_VERSION=$(sort -V "$TMP_VERSIONS" | tail -n1)
            echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          fi

          # Output results
          if [ "$UPDATED_COUNT" -gt 0 ]; then
            echo "✅ Updated $UPDATED_COUNT/$MATCHED_COUNT packages:"
            cat "$TMP_UPDATES"
            echo "updated_packages<<EOF" >> "$GITHUB_OUTPUT"
            cat "$TMP_UPDATES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          elif [ "$MATCHED_COUNT" -gt 0 ]; then
            echo "✅ All $MATCHED_COUNT packages are up-to-date"
          else
            echo "ℹ️ No packages matching '$APP_NAME' found"
          fi

          rm -f "$TMP_UPDATES" "$TMP_VERSIONS" "$TMP_COUNT" "$TMP_MATCHED"
          EOSCRIPT
          chmod +x update_script.sh

      - name: Check and update packages
        id: check_update
        uses: docker://cgr.dev/chainguard/wolfi-base:latest
        with:
          entrypoint: /usr/bin/ash
          args: ./update_script.sh

      - name: Create Pull Request
        if: steps.check_update.outputs.file_modified == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          title: 'Update "${{ matrix.name }}" to ${{ steps.check_update.outputs.latest_version }}'
          body: |
            Automated package update:
            ```
            ${{ steps.check_update.outputs.updated_packages }}
            ```
          add-paths: "${{ matrix.name }}/apko.yaml"
          branch: 'update-${{ matrix.name }}-${{ steps.check_update.outputs.latest_version }}'
          commit-message: 'Update ${{ matrix.name }} to ${{ steps.check_update.outputs.latest_version }}'
          sign-commits: true
