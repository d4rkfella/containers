name: Check for Package Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight

jobs:
  generate_matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Matrix
        id: generate
        run: |
          APP_LIST=$(find . -type f -name 'apko.yaml' ! -path '*/.*/*' -exec dirname {} \; | sed 's|^\./||' | sort -u)
          MATRIX_JSON=$(echo "$APP_LIST" | jq -R -s --compact-output 'split("\n") | map(select(length > 0)) | {include: map({name: .})}')
          echo "Generated matrix (compact):"
          echo "$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  check_and_update_package:
    needs: generate_matrix
    runs-on: ubuntu-latest
    if: needs.generate_matrix.outputs.matrix != '{}' && needs.generate_matrix.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and update packages
        id: check_update
        uses: docker://cgr.dev/chainguard/wolfi-base:latest
        with:
          entrypoint: /usr/bin/ash
          args: ./.github/scripts/check-packages.sh

      - name: Create Pull Request
        if: steps.check_update.outputs.file_modified == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          title: 'Update "${{ matrix.name }}" to ${{ steps.check_update.outputs.latest_version }}'
          body: |
            Automated package update:
            ```
            ${{ steps.check_update.outputs.updated_packages }}
            ```
          add-paths: "${{ matrix.name }}/apko.yaml"
          branch: 'update-${{ matrix.name }}-${{ steps.check_update.outputs.latest_version }}'
          commit-message: 'Update ${{ matrix.name }} to ${{ steps.check_update.outputs.latest_version }}'
          sign-commits: true
