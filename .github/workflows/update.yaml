name: Check for Package Updates

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Comma-separated list of architectures to validate against'
        required: false
        default: 'x86_64,aarch64'
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight

jobs:
  prepare_matrix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate Matrix
        id: generate
        run: |
          APP_LIST=$(find . -type f -name 'apko.yaml' ! -path '*/.*/*' -exec dirname {} \; | sed 's|^\./||' | sort -u)
          MATRIX_JSON=$(echo "$APP_LIST" | jq -R -s --compact-output 'split("\n") | map(select(length > 0)) | {include: map({name: .})}')
          echo "Generated matrix (compact):"
          echo "$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  check_and_update_package:
    needs: [prepare_matrix]
    runs-on: ubuntu-24.04
    if: ${{ fromJson(needs.prepare_matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup apk-tools
        id: apk
        uses: d4rkfella/actions/setup-apk-tools@main
        with:
          repositories: |
            https://packages.wolfi.dev/os
            https://packages.darkfellanetwork.com/artifactory/wolfi-os/latest/main
          keys: |
            https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
            https://packages.darkfellanetwork.com/artifactory/wolfi-os/melange.rsa.pub
          arch: ${{ github.event.inputs.arch || 'x86_64,aarch64' }}

      - name: Install yq
        run: |
          curl --retry 3 -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Check and update packages
        id: check_update
        run: |
          set -euo pipefail

          IMAGE_NAME="${{ matrix.name }}"
          APKO_FILE="${IMAGE_NAME}/apko.yaml"
          METADATA_FILE="${IMAGE_NAME}/metadata.yaml"
          ARCHES="${{ github.event.inputs.arch || 'x86_64,aarch64' }}"

          echo "file_modified=false"  >> "$GITHUB_OUTPUT"
          echo "commit_title="        >> "$GITHUB_OUTPUT"
          echo "commit_body="         >> "$GITHUB_OUTPUT"

          if [ ! -f "$METADATA_FILE" ]; then
            echo "⚠️  No metadata.yaml found for $IMAGE_NAME"
            exit 0
          fi

          MAIN_PKG=$(yq e '.main_package' "$METADATA_FILE" 2>/dev/null || echo "")
          if [ -z "$MAIN_PKG" ]; then
            echo "⚠️  No main_package defined in $METADATA_FILE"
            exit 0
          fi

          CURRENT_MAIN_VERSION=$(yq e '.version' "$METADATA_FILE" 2>/dev/null || echo "")

          PINNED_PACKAGES=$(yq e '.contents.packages[] | select(test("="))' "$APKO_FILE" 2>/dev/null || echo "")
          if [ -z "$PINNED_PACKAGES" ]; then
            echo "ℹ️  No pinned packages found in $APKO_FILE"
            exit 0
          fi

          echo "📦 Pinned packages found:"
          echo "$PINNED_PACKAGES"

          UPDATED_LINES=""
          NEW_MAIN_VERSION=""

          while IFS= read -r PIN; do
            [ -z "$PIN" ] && continue

            PACKAGE_NAME=$(echo "$PIN" | cut -d= -f1)
            CURRENT_VERSION=$(echo "$PIN" | cut -d= -f2)

            echo "::group::Checking $PACKAGE_NAME"

            LATEST_VERSION=""
            SKIP_PACKAGE=false

            IFS=',' read -ra ARCH_LIST <<< "$ARCHES"
            for ARCH in "${ARCH_LIST[@]}"; do
              ARCH=$(echo "$ARCH" | xargs)

              LATEST_FULL=$(apk.static --root "${{ steps.apk.outputs.apk-root }}" --arch "$ARCH" search --exact "$PACKAGE_NAME" 2>/dev/null | head -n1 || true)
              ARCH_VERSION=$(echo "$LATEST_FULL" | sed "s/^${PACKAGE_NAME}-//" || true)

              if [ -z "$ARCH_VERSION" ]; then
                echo "⚠️  Could not resolve latest version for $PACKAGE_NAME on $ARCH"
                SKIP_PACKAGE=true
                break
              fi

              echo "  [$ARCH] latest: $ARCH_VERSION"

              if [ -z "$LATEST_VERSION" ]; then
                LATEST_VERSION="$ARCH_VERSION"
              elif [ "$ARCH_VERSION" != "$LATEST_VERSION" ]; then
                echo "⚠️  Version mismatch across arches for $PACKAGE_NAME: $LATEST_VERSION (${{'{' }}ARCH_LIST[0]}) vs $ARCH_VERSION ($ARCH)"
                SKIP_PACKAGE=true
                break
              fi
            done

            if [ "$SKIP_PACKAGE" = "true" ]; then
              echo "⏭️  Skipping $PACKAGE_NAME"
              echo "::endgroup::"
              continue
            fi

            COMPARE=$(apk.static version -t "$CURRENT_VERSION" "$LATEST_VERSION")

            case "$COMPARE" in
              "<")
                echo "🔄 $PACKAGE_NAME: $CURRENT_VERSION → $LATEST_VERSION"
                yq e "(.contents.packages[] | select(. == \"${PACKAGE_NAME}=${CURRENT_VERSION}\")) = \"${PACKAGE_NAME}=${LATEST_VERSION}\"" -i "$APKO_FILE"
                UPDATED_LINES="${UPDATED_LINES}- ${PACKAGE_NAME}: ${CURRENT_VERSION} → ${LATEST_VERSION}\n"
                if [ "$PACKAGE_NAME" = "$MAIN_PKG" ]; then
                  NEW_MAIN_VERSION="$LATEST_VERSION"
                fi
                ;;
              "=")
                echo "✓ $PACKAGE_NAME is up-to-date ($CURRENT_VERSION)"
                ;;
              ">")
                echo "⚠️  $PACKAGE_NAME current ($CURRENT_VERSION) is newer than available ($LATEST_VERSION)"
                ;;
              *)
                echo "⚠️  Invalid comparison result for $PACKAGE_NAME"
                ;;
            esac

            echo "::endgroup::"
          done <<< "$PINNED_PACKAGES"

          if [ -z "$UPDATED_LINES" ]; then
            echo "✅ All packages are up-to-date"
            exit 0
          fi

          echo "file_modified=true" >> "$GITHUB_OUTPUT"

          semver_part() {
            echo "$1" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' | cut -d. -f"$2"
          }

          if [ -n "$NEW_MAIN_VERSION" ] && [ -n "$CURRENT_MAIN_VERSION" ]; then
            OLD_MAJOR=$(semver_part "$CURRENT_MAIN_VERSION" 1)
            NEW_MAJOR=$(semver_part "$NEW_MAIN_VERSION" 1)
            OLD_MINOR=$(semver_part "$CURRENT_MAIN_VERSION" 2)
            NEW_MINOR=$(semver_part "$NEW_MAIN_VERSION" 2)
            OLD_PATCH=$(semver_part "$CURRENT_MAIN_VERSION" 3)
            NEW_PATCH=$(semver_part "$NEW_MAIN_VERSION" 3)

            DISPLAY_VERSION=$(echo "$NEW_MAIN_VERSION" | sed 's/-r[0-9]*$//')

            yq e ".version = \"${DISPLAY_VERSION}\"" -i "$METADATA_FILE"

            if [ "$NEW_MAJOR" != "$OLD_MAJOR" ]; then
              COMMIT_TYPE="feat!"
            elif [ "$NEW_MINOR" != "$OLD_MINOR" ]; then
              COMMIT_TYPE="feat"
            elif [ "$NEW_PATCH" != "$OLD_PATCH" ]; then
              COMMIT_TYPE="fix"
            else
              COMMIT_TYPE="chore"
            fi

            COMMIT_TITLE="${COMMIT_TYPE}(${IMAGE_NAME}): ${CURRENT_MAIN_VERSION} → ${NEW_MAIN_VERSION}"
          else
            COMMIT_TITLE="chore(${IMAGE_NAME}): bump dependencies"
          fi

          COMMIT_BODY=$(printf '%b' "$UPDATED_LINES" | sed '/^$/d')

          echo "commit_title=${COMMIT_TITLE}" >> "$GITHUB_OUTPUT"

          {
            echo "commit_body<<EOF"
            echo "$COMMIT_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "📝 Commit: ${COMMIT_TITLE}"
          echo "$COMMIT_BODY"

      - name: Create Pull Request
        if: steps.check_update.outputs.file_modified == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          title: ${{ steps.check_update.outputs.commit_title }}
          body: |
            ${{ steps.check_update.outputs.commit_body }}
          commit-message: |
            ${{ steps.check_update.outputs.commit_title }}

            ${{ steps.check_update.outputs.commit_body }}
          add-paths: |
            ${{ matrix.name }}/apko.yaml
            ${{ matrix.name }}/metadata.yaml
          branch: update-${{ matrix.name }}
          delete-branch: true
          sign-commits: true
