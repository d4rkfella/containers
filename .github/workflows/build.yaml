name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Required: Name of a specific app to build.'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '**/apko.yaml'

permissions:
  contents: read

jobs:
  prepare_matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Handle Push Event
        id: push_event
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "::group::Processing Push Event"
          changed_apko_files=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- '**/apko.yaml' || true)

          if [[ -n "$changed_apko_files" ]]; then
            echo "Changed/added apko.yaml files found:"
            echo "$changed_apko_files"
            mapfile -t files_array < <(echo "$changed_apko_files")
            for file_path in "${files_array[@]}"; do
              dir_name=$(dirname "$file_path" | sed 's|^\./||')
              if [[ -n "$dir_name" ]]; then
                echo "apps_list<<EOF" >> "$GITHUB_OUTPUT"
                echo "$dir_name" >> "$GITHUB_OUTPUT"
                echo "EOF" >> "$GITHUB_OUTPUT"
              fi
            done
          fi
          echo "::endgroup::"

      - name: Handle Workflow Dispatch
        id: workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "::group::Processing Workflow Dispatch"
          echo "Workflow dispatch with for app: '${{ github.event.inputs.app_name }}'"
          
          if [ ! -f "${{ github.event.inputs.app_name }}/apko.yaml" ]; then
            echo "::error::No apko.yaml found in directory '${{ github.event.inputs.app_name }}'"
            exit 1
          fi
          
          echo "apps_list<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ github.event.inputs.app_name }}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Determine App Version
        id: determine_version
        shell: bash
        run: |
          set -eo pipefail
          echo "::group::Determine Container version"
      
          mapfile -t apps_list < <(echo "${{ steps.push_event.outputs.apps_list }}${{ steps.workflow_dispatch.outputs.apps_list }}" | grep -v '^$' | sort -u)
      
          declare -a apps_list_with_versions=()
      
          for app in "${apps_list[@]}"; do
            echo "::group::Processing $app"
      
            APKO_FILE="${app}/apko.yaml"      
            
            mapfile -t packages < <(yq '.contents.packages[]' "$APKO_FILE")
      
            matched_line=""
            for pkg_line in "${packages[@]}"; do
              pkg_name="${pkg_line%%=*}"
      
              if [[ "$app" == *"$pkg_name"* ]] || [[ "$pkg_name" == *"$app"* ]]; then
                matched_line="$pkg_line"
                break
              fi
            done
      
            if [[ -z "$matched_line" ]]; then
              echo "Warning: No matching package found for $app in $APKO_FILE. Skipping."
              echo "::endgroup::"
              continue
            fi
      
            PACKAGE_VERSION=$(echo "$matched_line" | cut -d= -f2)
            VERSION=$(echo "$PACKAGE_VERSION" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
      
            if [[ -z "$VERSION" ]]; then
              echo "Warning: Could not extract semantic version from '$PACKAGE_VERSION'. Skipping."
              echo "::endgroup::"
              continue
            fi
      
            echo "Found version $VERSION for app $app"
            apps_list_with_versions+=("$app,$VERSION")
      
            echo "::endgroup::"
          done
      
          if [ "${#apps_list_with_versions[@]}" -eq 0 ]; then
            echo "apps_list_with_versions=" >> "$GITHUB_OUTPUT"
          else
            echo "apps_list_with_versions<<EOF" >> "$GITHUB_OUTPUT"
            printf "%s\n" "${apps_list_with_versions[@]}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
      
          echo "::endgroup::"
      
      - name: Generate Build Matrix
        id: generate_matrix
        shell: bash
        run: |
          set -eo pipefail
          echo "::group::Generating Build Matrix"
      
          matrix_json="[]"
      
          if [[ -z "${{ steps.determine_version.outputs.apps_list_with_versions }}" ]]; then
            echo "No apps with versions found, skipping matrix generation."
          else
            mapfile -t apps_list_with_versions < <(echo "${{ steps.determine_version.outputs.apps_list_with_versions }}")
      
            for entry in "${apps_list_with_versions[@]}"; do
              if [[ -z "$entry" ]]; then
                continue
              fi
      
              IFS=, read -r app version <<< "$entry"
      
              if [[ -z "$app" || -z "$version" ]]; then
                continue
              fi
      
              echo "Formatting matrix entry for $app:$version"
      
              MAJOR_VERSION=$(echo "$version" | cut -d. -f1)
              MAJOR_MINOR_VERSION=$(echo "$version" | cut -d. -f1-2)
      
              entry_json=$(jq -n \
                --arg name "$app" \
                --arg full_version "$version" \
                --arg major_version "$MAJOR_VERSION" \
                --arg major_minor_version "$MAJOR_MINOR_VERSION" \
                '{name: $name, full_version: $full_version, major_version: $major_version, major_minor_version: $major_minor_version}')
              matrix_json=$(echo "$matrix_json" | jq ". += [$entry_json]")
            done
          fi
      
          matrix_output=$(echo "$matrix_json" | jq -c '{"include": .}')
          echo "matrix=$matrix_output" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

  setup:
    needs: prepare_matrix
    if: ${{ fromJson(needs.prepare_matrix.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-24.04
    steps:
      - name: Create Cache Key
        id: cache
        run: echo "key=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore Wolfi SDK
        id: sdk-restore
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: wolfi-sdk-${{ steps.cache.outputs.key }}
          path: wolfi-sdk.tar
          lookup-only: true

      - name: Preload Wolfi SDK
        if: ${{ always() && steps.sdk-restore.outputs.cache-hit != 'true' }}
        run: |
          docker pull ghcr.io/wolfi-dev/sdk:latest
          docker save ghcr.io/wolfi-dev/sdk:latest > wolfi-sdk.tar

      - name: Cache Wolfi SDK
        if: ${{ always() && steps.sdk-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: wolfi-sdk-${{ steps.cache.outputs.key }}
          path: wolfi-sdk.tar

  build:
    needs: [prepare_matrix, setup]
    if: ${{ fromJson(needs.prepare_matrix.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.prepare_matrix.outputs.matrix)}}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - name: Retreive Cache Key
        id: cache
        run: echo "key=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore Wolfi SDK
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: wolfi-sdk-${{ steps.cache.outputs.key }}
          path: wolfi-sdk.tar

      - name: Load Wolfi SDK
        run: |
          docker load < wolfi-sdk.tar

      - name: Generate snapshot date
        id: snapshot-date
        shell: bash
        run: |
          echo "epoch=$(date -u +%s)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and Push ${{ matrix.name }} with Apko
        uses: d4rkfella/actions/apko-snapshot@main
        id: apko
        with:
          config: ${{ matrix.name }}/apko.yaml
          source-date-epoch: ${{ steps.snapshot-date.outputs.epoch }}
          additional-tags: ${{ matrix.full_version }},${{ matrix.major_version }},${{ matrix.major_minor_version }}
          archs: amd64,arm64
          slsa-attest: "true"
          sbom-attest: "true"
          build-repository-append: https://packages.darkfellanetwork.com/wolfi-os
          keyring-append: https://packages.darkfellanetwork.com/wolfi-os/melange.rsa.pub
          annotations: "org.opencontainers.image.url:https://ghcr.io/${{ github.repository_owner }}/${{ matrix.name }},org.opencontainers.image.version:${{ matrix.full_version }},org.opencontainers.image.revision:${{ github.sha }},org.opencontainers.image.vendor:${{ github.repository_owner }}"
          base-tag: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}

      - name: Create success marker
        if: steps.apko.outcome == 'success'
        shell: bash
        env:
          APP_NAME: ${{ matrix.name }}
          APP_VERSION: ${{ matrix.full_version }}
          DIGEST: ${{ steps.apko.outputs.digest }}
        run: |
          MARKER_CONTENT=$(jq -n --arg name "$APP_NAME" --arg ver "$APP_VERSION" --arg digest "$DIGEST" '{name: $name, tag: $ver, digest: $digest}')
          echo "$MARKER_CONTENT" > "./success_marker-$APP_NAME.json"

      - name: Upload success marker
        if: steps.apko.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: success-marker-${{ matrix.name }}
          path: ./success_marker-${{ matrix.name }}.json
          retention-days: 1
