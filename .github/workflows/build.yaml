name: Terraform CI

on:
  schedule:
    - cron: '0 0 * * *'   # Run daily at midnight UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  discover-terraform-configs:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-matrix.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-matrix
        run: |
          folders=$(find . -type f -name "main.tf" -exec dirname {} \; | sort -u)
          folders=$(echo $folders | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "folders=$folders" >> $GITHUB_OUTPUT

  build:
    needs: discover-terraform-configs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.discover-terraform-configs.outputs.folders) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_wrapper: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Terraform Apply
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init -backend-config="../common_backend.conf"
          terraform apply -auto-approve
