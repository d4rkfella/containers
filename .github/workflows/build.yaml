name: Build, Sign, and Attest (Hardened)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for Keyless signing
  packages: write   # To push sigs/atts to GHCR
  contents: read    # To read repo and SBOMs

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [bazarr]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Setup Crane
        uses: iarekylew00t/crane-installer@65372ffaef057f1714fed388fc3df3ad2c441aef # v4.0.10

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_wrapper: true

      - name: Terraform Apply
        id: tf
        working-directory: ${{ matrix.name }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terraform init -backend-config="../common_backend.conf"
          terraform apply -auto-approve

      - name: Extract Artifact Metadata
        id: meta
        shell: bash
        working-directory: ${{ matrix.name }}
        run: |
          SBOMS=$(terraform output -json sboms)
          echo "sboms=${SBOMS}" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: 🔐 Sign All Artifacts
        shell: bash
        env:
          SBOMS: ${{ steps.meta.outputs.sboms }}
          IMAGE: ${{ steps.meta.outputs.image_name }}
        run: |
          # Sign every digest (Index + Arches) returned by the provider
          echo "$SBOMS" | jq -r 'to_entries[].value.digest' | while read -r digest; do
            echo "Signing $IMAGE@$digest"
            cosign sign --yes "$IMAGE@$digest" \
              -a sha=${{ github.sha }} \
              -a run_id=${{ github.run_id }} \
              -a run_attempt=${{ github.run_attempt }}
          done

      - name: 📝 Attest SBOMs (SPDX)
        shell: bash
        env:
          SBOMS: ${{ steps.meta.outputs.sboms }}
          IMAGE: ${{ steps.meta.outputs.image_name }}
        run: |
          # Attest the architecture-specific SBOMs to their respective digests
          echo "$SBOMS" | jq -r 'to_entries[] | "\(.value.digest) \(.value.predicate_path)"' | while read -r digest path; do
            if [ -f "$path" ]; then
              echo "Attesting SBOM for $digest"
              cosign attest --yes --type spdxjson --predicate "$path" "$IMAGE@$digest"
            fi
          done

      - name: 🛡️ Generate and Attest SLSA Provenance
        shell: bash
        env:
          SBOMS: ${{ steps.meta.outputs.sboms }}
          IMAGE: ${{ steps.meta.outputs.image_name }}
          GH_TOKEN: "${{ github.token }}"
          # Pinned generator details from your original workflow
          GEN_VER: v2.1.0
          GEN_BIN: slsa-generator-container-linux-amd64
          GEN_SHA: cee1453de115735379dd98dc80f70c73a66fcfefb5674e062f8765a1021e4cc6
        run: |
          # Download and verify the SLSA generator
          gh release download "$GEN_VER" -R slsa-framework/slsa-github-generator -p "$GEN_BIN"
          echo "$GEN_SHA  $GEN_BIN" | sha256sum --strict --check
          chmod +x "$GEN_BIN"
          
          # Generate the Provenance predicate
          ./"$GEN_BIN" generate --predicate="provenance.json"

          # Attest the SLSA provenance to every image digest in the tree
          echo "$SBOMS" | jq -r 'to_entries[].value.digest' | while read -r digest; do
            echo "Attesting SLSA for $digest"
            cosign attest --yes --type slsaprovenance --predicate="provenance.json" "$IMAGE@$digest"
          done
