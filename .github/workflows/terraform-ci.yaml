name: Terraform CI
on:
  schedule:
    - cron: '30 * * * *' # Runs at minute 30 of every hour
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/apko.yaml'
  workflow_dispatch:
permissions:
  id-token: write
  packages: write
  contents: read
jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-matrix.outputs.folders || steps.map-folders.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Full Scan Discovery
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: set-matrix
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const folders = fs.readdirSync('.', { recursive: true })
              .filter(f => f.endsWith('main.tf'))
              .map(f => path.dirname(f));
            const uniqueFolders = [...new Set(folders)].filter(f => f !== '.');
            core.setOutput('folders', JSON.stringify(uniqueFolders));
      - name: Get Changed Files
        if: github.event_name == 'push'
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |
            **/*.tf
            **/apko.yaml
      - name: Map Push Files to Folders
        if: github.event_name == 'push'
        id: map-folders
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const path = require('path');
            const files = ${{ steps.changed-files.outputs.changed_files || '[]' }};
            const folders = [...new Set(files.map(file => path.dirname(file)))].filter(f => f !== '.');
            core.setOutput('folders', JSON.stringify(folders));
  apply:
    needs: setup-matrix
    if: needs.setup-matrix.outputs.folders != '[]' && needs.setup-matrix.outputs.folders != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.setup-matrix.outputs.folders) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_wrapper: false
      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init \
            -backend-config="../common_backend.conf" \
            -backend-config="key=${{ matrix.folder }}/terraform.tfstate"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform plan -out=tfplan
          # Save a human-readable version for the summary
          terraform show -no-color tfplan > tfplan.txt

      - name: Plan Summary
        working-directory: ${{ matrix.folder }}
        run: |
          echo "## Terraform Plan — \`${{ matrix.folder }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat tfplan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Terraform Apply
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform apply tfplan
