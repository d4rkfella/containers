name: Terraform CI

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/apko.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-matrix.outputs.folders || steps.map-folders.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      
      - name: Full Scan Discovery
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: set-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const folders = fs.readdirSync('.', { recursive: true })
              .filter(f => f.endsWith('main.tf'))
              .map(f => path.dirname(f));
            const uniqueFolders = [...new Set(folders)].filter(f => f !== '.');
            core.setOutput('folders', JSON.stringify(uniqueFolders));
      
      - name: Get Changed Files
        if: github.event_name == 'push'
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |
            **/*.tf
            **/apko.yaml
      
      - name: Map Push Files to Folders
        if: github.event_name == 'push'
        id: map-folders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const files = ${{ steps.changed-files.outputs.changed_files || '[]' }};
            const folders = [...new Set(files.map(file => path.dirname(file)))].filter(f => f !== '.');
            core.setOutput('folders', JSON.stringify(folders));
  
  apply:
    needs: setup-matrix
    if: needs.setup-matrix.outputs.folders != '[]' && needs.setup-matrix.outputs.folders != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.setup-matrix.outputs.folders) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      
      - name: Setup QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init \
            -backend-config="../common_backend.conf" \
            -backend-config="key=${{ matrix.folder }}/terraform.tfstate"

      - name: Terraform Plan & Apply
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform apply -auto-approve -no-color
