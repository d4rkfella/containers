name: Terraform CI

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/apko.yaml'
      - '**/.terraform.lock.hcl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-targets:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-matrix.outputs.folders || steps.map-folders.outputs.folders }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover All Targets
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: set-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const folders = fs.readdirSync('.', { recursive: true })
              .filter(f => f.endsWith('main.tf'))
              .map(f => path.dirname(f));

            const uniqueFolders = [
              ...new Set(folders)
            ].filter(f => f !== '.');

            core.setOutput(
              'folders',
              JSON.stringify(uniqueFolders)
            );

      - name: Detect Changed Files
        if: github.event_name == 'push'
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            **/*.tf
            **/apko.yaml
            **/.terraform.lock.hcl

      - name: Map Push Files to Parent Folders
        if: github.event_name == 'push'
        id: map-folders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files || '[]' }}
        with:
          script: |
            const path = require('path');
            const files = JSON.parse(process.env.CHANGED_FILES);

            const folders = [
              ...new Set(
                files.map(file => path.dirname(file))
              )
            ].filter(f => f !== '.');

            core.setOutput(
              'folders',
              JSON.stringify(folders)
            );

  build:
    needs: discover-targets
    if: needs.discover-targets.outputs.folders != '[]' && needs.discover-targets.outputs.folders != ''
    runs-on: ubuntu-latest
    environment: automation

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.discover-targets.outputs.folders) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FOLDER: ${{ matrix.folder }}
        run: |
          set -euo pipefail

          terraform init \
            -backend-config="../common_backend.conf" \
            -backend-config="key=$FOLDER/terraform.tfstate"

      - name: Terraform Plan
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          terraform plan -out=tfplan
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

      - name: Plan Summary
        working-directory: ${{ matrix.folder }}
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          set -euo pipefail

          {
            echo "## Terraform Plan — \`$FOLDER\`"
            echo '```'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check plan scope
        id: scope
        working-directory: ${{ matrix.folder }}
        run: |
          set -euo pipefail

          CHANGED_TYPES="$(
            jq -r '
              [
                .resource_changes[]?
                | select((.change.actions | index("no-op")) | not)
                | .type
              ]
              | unique
              | join(",")
            ' tfplan.json
          )"

          echo "changed_types=$CHANGED_TYPES" >> "$GITHUB_OUTPUT"

          if [ -z "$CHANGED_TYPES" ] || [ "$CHANGED_TYPES" = "cosign_attest" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Apply
        if: steps.scope.outputs.skip != 'true'
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          terraform apply tfplan

      - name: Record Image Reference
        if: steps.scope.outputs.skip != 'true'
        working-directory: ${{ matrix.folder }}
        run: |
          set -euo pipefail

          mkdir -p image_ref

          terraform output -json image_ref > image_ref/marker.json

      - name: Upload Image Reference
        if: steps.scope.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-ref-${{ strategy.job-index }}
          path: ${{ matrix.folder }}/image_ref/marker.json
          retention-days: 1
          if-no-files-found: error

  collect-image-refs:
    name: Collect image refs
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest

    permissions:
      actions: read

    outputs:
      image_refs: ${{ steps.image-refs.outputs.image_refs }}

    steps:
      - name: Download Image References
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: image-ref-*
          path: ./image-refs
          merge-multiple: true

      - name: Collect Image References
        id: image-refs
        shell: bash
        run: |
          set -euo pipefail

          if compgen -G "./image-refs/*.json" > /dev/null; then
            image_refs="$(jq -sc '.' ./image-refs/*.json)"
          else
            image_refs='[]'
          fi

          echo "Image refs:"
          jq . <<<"$image_refs"

          {
            echo 'image_refs<<EOF'
            echo "$image_refs"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  scan-images:
    name: Scan Built Images
    needs: collect-image-refs
    if: needs.collect-image-refs.outputs.image_refs != '[]'
    uses: ./.github/workflows/scan-images.yaml

    permissions:
      contents: read
      packages: read
      security-events: write
      id-token: write
    with:
      image_refs: ${{ needs.collect-image-refs.outputs.image_refs }}
