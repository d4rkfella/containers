name: Terraform CI

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/apko.yaml'
      - '**/.terraform.lock.hcl'
  workflow_dispatch:

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-matrix.outputs.folders || steps.map-folders.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Full Scan Discovery
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: set-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const folders = fs.readdirSync('.', { recursive: true })
              .filter(f => f.endsWith('main.tf'))
              .map(f => path.dirname(f));
            const uniqueFolders = [...new Set(folders)].filter(f => f !== '.');
            core.setOutput('folders', JSON.stringify(uniqueFolders));
      
      - name: Get Changed Files
        if: github.event_name == 'push'
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |
            **/*.tf
            **/apko.yaml
            **/.terraform.lock.hcl
      
      - name: Map Push Files to Folders
        if: github.event_name == 'push'
        id: map-folders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const files = ${{ steps.changed-files.outputs.changed_files || '[]' }};
            const folders = [...new Set(files.map(file => path.dirname(file)))].filter(f => f !== '.');
            core.setOutput('folders', JSON.stringify(folders));
  
  apply:
    needs: setup-matrix
    if: needs.setup-matrix.outputs.folders != '[]' && needs.setup-matrix.outputs.folders != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.setup-matrix.outputs.folders) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      
      - name: Setup QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init \
            -backend-config="../common_backend.conf" \
            -backend-config="key=${{ matrix.folder }}/terraform.tfstate"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform plan -out=tfplan
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

      - name: Plan Summary
        working-directory: ${{ matrix.folder }}
        run: |
          echo "## Terraform Plan — \`${{ matrix.folder }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat tfplan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check plan scope
        id: scope
        working-directory: ${{ matrix.folder }}
        run: |
          CHANGED_TYPES=$(jq -r '
            [.resource_changes[]? | select((.change.actions | index("no-op")) | not) | .type]
            | unique | join(",")
          ' tfplan.json)

          echo "changed_types=${CHANGED_TYPES}" >> "$GITHUB_OUTPUT"

          if [ -z "$CHANGED_TYPES" ] || [ "$CHANGED_TYPES" = "cosign_attest" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Apply
        if: steps.scope.outputs.skip != 'true'
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform apply tfplan
