name: Scan Container Images

on:
  workflow_run:
    workflows: ["Build Docker Images"]
    types:
      - completed
  schedule:
    - cron: "0 3 * * 0"

jobs:
  prepare_scan_matrix:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_run' &&
        contains(fromJson('["success", "failure"]'), github.event.workflow_run.conclusion)
      )
    outputs:
      scan_matrix: ${{ steps.build_matrix.outputs.scan_matrix }}
    steps:
      - name: Download success markers
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: success-marker-*
          path: ./success-markers
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Checkout code
        if: github.event_name == 'schedule'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build scan matrix
        id: build_matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            if (process.env.EVENT_NAME === 'workflow_run') {
              const dir     = './success-markers';
              const include = [];

              if (fs.existsSync(dir)) {
                for (const file of fs.readdirSync(dir).filter(f => f.endsWith('.json'))) {
                  try {
                    const entry = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
                    core.info(`Loaded marker: ${JSON.stringify(entry)}`);
                    include.push(entry);
                  } catch (e) {
                    core.warning(`Could not parse ${file}: ${e.message}`);
                  }
                }
              }

              const matrix = JSON.stringify(include);
              core.info(`Scan matrix (workflow_run): ${matrix}`);
              core.setOutput('scan_matrix', matrix);
              return;
            }

            const { execSync } = require('child_process');

            const apkoDirs = execSync(
              `find . -type f -name 'apko.yaml' ! -path '*/.*/*' -exec dirname {} \\;`,
              { encoding: 'utf8' }
            )
              .trim()
              .split('\n')
              .filter(Boolean)
              .map(d => d.replace(/^\.\//, ''))
              .sort();

            if (apkoDirs.length === 0) {
              core.warning('No apko.yaml files found — empty matrix');
              core.setOutput('scan_matrix', '[]');
              return;
            }

            core.info(`Found apps: ${apkoDirs.join(', ')}`);

            const OWNER = process.env.OWNER;
            const semverRe = /^\d+\.\d+\.\d+(-r\d+)?$/;
            const include  = [];

            for (const appDir of apkoDirs) {
              const appName = path.basename(appDir);
              const apiUrl  = `https://api.github.com/users/${OWNER}/packages/container/${appName}/versions`;

              let versions;
              try {
                versions = await github.paginate(
                  'GET /users/{owner}/packages/{package_type}/{package_name}/versions',
                  { owner: OWNER, package_type: 'container', package_name: appName }
                );
              } catch (e) {
                if (e.status === 404) {
                  core.warning(`Package '${appName}' not found in GHCR — skipping`);
                } else {
                  core.warning(`GHCR API error for '${appName}': ${e.message} — skipping`);
                }
                continue;
              }

              const sorted = versions
                .filter(v => v.metadata?.container?.tags?.length)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              let latestTag    = null;
              let imageDigest  = null;

              for (const v of sorted) {
                const tag = v.metadata.container.tags.find(t => semverRe.test(t));
                if (tag && v.name?.startsWith('sha256:')) {
                  latestTag   = tag;
                  imageDigest = v.name;
                  break;
                }
              }

              if (!latestTag || !imageDigest) {
                core.warning(`No valid semver tag + digest found for '${appName}' — skipping`);
                continue;
              }

              core.info(`${appName}: ${latestTag} @ ${imageDigest}`);
              include.push({
                name:   appName,
                tag:    latestTag,
                digest: `ghcr.io/${OWNER}/${appName}@${imageDigest}`,
              });
            }

            const matrix = JSON.stringify(include);
            core.info(`Scan matrix (schedule): ${matrix}`);
            core.setOutput('scan_matrix', matrix);

  grype:
    name: Setup Grype
    runs-on: ubuntu-24.04
    needs: prepare_scan_matrix
    if: needs.prepare_scan_matrix.outputs.scan_matrix != '[]'
    steps:
      - name: Compute cache key
        id: cache_key
        run: echo "key=grype-db-$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Grype database
        id: db-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ steps.cache_key.outputs.key }}
          path: ~/.cache/grype/db
          lookup-only: true

      - name: Install Grype
        if: steps.db-restore.outputs.cache-hit != 'true'
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0

      - name: Update Grype database
        if: steps.db-restore.outputs.cache-hit != 'true'
        run: ${{ steps.grype.outputs.cmd }} db update

      - name: Cache Grype database
        if: steps.db-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ steps.cache_key.outputs.key }}
          path: ~/.cache/grype/db

  vulnerability-scan:
    needs: [prepare_scan_matrix, grype]
    if: needs.prepare_scan_matrix.outputs.scan_matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.prepare_scan_matrix.outputs.scan_matrix) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Retrieve cache key
        id: cache_key
        run: echo "key=grype-db-$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Grype database
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ steps.cache_key.outputs.key }}
          path: ~/.cache/grype/db

      - name: Setup Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record scan start time
        id: scan-start
        run: echo "date=$(TZ=Zulu date '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Scan image with Grype
        id: grype-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ matrix.app.digest }}
          output-format: sarif
          output-file: grype-results-${{ matrix.app.name }}-${{ matrix.app.tag }}.sarif
          fail-build: false
          severity-cutoff: low

      - name: Attest Grype results with Cosign
        env:
          SARIF_FILE: ${{ steps.grype-scan.outputs.sarif }}
          SCAN_STARTED: ${{ steps.scan-start.outputs.date }}
          IMAGE_DIGEST: ${{ matrix.app.digest }}
          RUN_URI: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          ATTESTATION=$(mktemp)

          SCANNER_URI=$(jq -r '.runs[0].tool.driver.informationUri' "$SARIF_FILE")
          SCANNER_VERSION=$(jq -r '.runs[0].tool.driver.version' "$SARIF_FILE")

          echo "Grype URI:     $SCANNER_URI"
          echo "Grype version: $SCANNER_VERSION"

          jq -n \
            --arg uri        "$RUN_URI" \
            --arg event_id   "$RUN_ID" \
            --arg builder    "$WORKFLOW" \
            --arg s_uri      "$SCANNER_URI" \
            --arg s_ver      "$SCANNER_VERSION" \
            --arg started    "$SCAN_STARTED" \
            --arg finished   "$(TZ=Zulu date '+%Y-%m-%dT%H:%M:%SZ')" \
            --slurpfile sarif "$SARIF_FILE" \
            '{
              invocation: {
                parameters: null,
                uri:        $uri,
                event_id:   $event_id,
                "builder.id": $builder
              },
              scanner: {
                uri:     $s_uri,
                version: $s_ver,
                result:  $sarif[0]
              },
              metadata: {
                scanStartedOn:  $started,
                scanFinishedOn: $finished
              }
            }' > "$ATTESTATION"

          cosign attest --yes \
            --fulcio-url "https://fulcio.sigstore.dev" \
            --rekor-url  "https://rekor.sigstore.dev" \
            --type vuln \
            --predicate  "$ATTESTATION" \
            "$IMAGE_DIGEST"

      - name: Upload Grype SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v3.29.5
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: container:${{ matrix.app.name }}

      - name: Verify Cosign attestation
        env:
          IMAGE_DIGEST: ${{ matrix.app.digest }}
        run: |
          cat > vulnz.cue <<EOF
          predicateType: "https://cosign.sigstore.dev/attestation/vuln/v1"
          EOF

          cosign verify-attestation \
            --type vuln \
            --policy vulnz.cue \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity   "https://github.com/${{ github.workflow_ref }}" \
            "$IMAGE_DIGEST" \
          || echo "WARNING: Could not verify attestation (is this a private image?)"
