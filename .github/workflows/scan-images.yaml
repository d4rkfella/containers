name: Scan Container Images

on:
  workflow_call:
    inputs:
      image_refs:
        description: >-
          JSON array containing immutable container image refs to scan,
          e.g. ["ghcr.io/org/app@sha256:<64-hex-digest>"]
        type: string
        required: true

permissions: {}

jobs:
  prepare_scan_matrix:
    name: Validate scan inputs
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      scan_matrix: ${{ steps.build_matrix.outputs.scan_matrix }}

    steps:
      - name: Validate and build scan matrix
        id: build_matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IMAGES: ${{ inputs.image_refs }}
        with:
          script: |
            let images;

            try {
              images = JSON.parse(process.env.IMAGES);
            } catch (error) {
              core.setFailed(`image_refs is not valid JSON: ${error.message}`);
              return;
            }

            if (!Array.isArray(images)) {
              core.setFailed('image_refs must be a JSON array');
              return;
            }

            if (images.length === 0) {
              core.setFailed('image_refs must not be empty');
              return;
            }

            const digestRef =
              /^[a-z0-9](?:[a-z0-9._/-]*[a-z0-9])?@sha256:[a-f0-9]{64}$/;

            for (const image of images) {
              if (typeof image !== 'string' || !digestRef.test(image)) {
                core.setFailed(
                  `Invalid image reference: ${JSON.stringify(image)}`
                );
                return;
              }
            }

            const uniqueImages = [...new Set(images)];

            core.info(`Validated ${uniqueImages.length} unique image(s).`);

            core.setOutput(
              'scan_matrix',
              JSON.stringify(uniqueImages)
            );

  grype:
    name: Setup Grype database
    runs-on: ubuntu-26.04
    needs: prepare_scan_matrix
    if: needs.prepare_scan_matrix.outputs.scan_matrix != '[]'
    permissions: {}

    steps:
      - name: Compute cache key
        id: cache_key
        shell: bash
        run: |
          set -euo pipefail
          echo "key=grype-db-$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Grype database
        id: db-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache_key.outputs.key }}
          path: ~/.cache/grype/db
          lookup-only: true

      - name: Install Grype
        if: steps.db-restore.outputs.cache-hit != 'true'
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Update Grype database
        if: steps.db-restore.outputs.cache-hit != 'true'
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        shell: bash
        run: |
          set -euo pipefail
          "$GRYPE_CMD" db update

      - name: Cache Grype database
        if: steps.db-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache_key.outputs.key }}
          path: ~/.cache/grype/db

  vulnerability-scan:
    name: Scan ${{ matrix.image }}
    needs:
      - prepare_scan_matrix
      - grype
    if: needs.prepare_scan_matrix.outputs.scan_matrix != '[]'
    runs-on: ubuntu-26.04

    permissions:
      packages: write
      security-events: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare_scan_matrix.outputs.scan_matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Compute cache key
        id: cache_key
        shell: bash
        run: |
          set -euo pipefail
          echo "key=grype-db-$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Grype database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache_key.outputs.key }}
          path: ~/.cache/grype/db

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record scan start time
        id: scan-start
        shell: bash
        run: |
          set -euo pipefail
          echo "date=$(TZ=Zulu date '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Scan image with Grype
        id: grype-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.image }}
          output-format: sarif
          output-file: grype-results.sarif
          fail-build: false
          severity-cutoff: low

      - name: Attest Grype results with Cosign
        env:
          SARIF_FILE: ${{ steps.grype-scan.outputs.sarif }}
          SCAN_STARTED: ${{ steps.scan-start.outputs.date }}
          IMAGE_REF: ${{ matrix.image }}
          RUN_URI: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail

          ATTESTATION="$(mktemp)"

          SCANNER_URI="$(jq -r '.runs[0].tool.driver.informationUri' "$SARIF_FILE")"
          SCANNER_VERSION="$(jq -r '.runs[0].tool.driver.version' "$SARIF_FILE")"

          if [[ -z "$SCANNER_URI" || "$SCANNER_URI" == "null" ]]; then
            echo "::error::Could not determine Grype scanner URI from SARIF"
            exit 1
          fi

          if [[ -z "$SCANNER_VERSION" || "$SCANNER_VERSION" == "null" ]]; then
            echo "::error::Could not determine Grype scanner version from SARIF"
            exit 1
          fi

          echo "Grype URI:     $SCANNER_URI"
          echo "Grype version: $SCANNER_VERSION"

          jq -n \
            --arg uri        "$RUN_URI" \
            --arg event_id   "$RUN_ID" \
            --arg builder    "$WORKFLOW" \
            --arg s_uri      "$SCANNER_URI" \
            --arg s_ver      "$SCANNER_VERSION" \
            --arg started    "$SCAN_STARTED" \
            --arg finished   "$(TZ=Zulu date '+%Y-%m-%dT%H:%M:%SZ')" \
            --slurpfile sarif "$SARIF_FILE" \
            '{
              invocation: {
                parameters: null,
                uri:        $uri,
                event_id:   $event_id,
                "builder.id": $builder
              },
              scanner: {
                uri:     $s_uri,
                version: $s_ver,
                result:  $sarif[0]
              },
              metadata: {
                scanStartedOn:  $started,
                scanFinishedOn: $finished
              }
            }' > "$ATTESTATION"

          cosign attest --yes \
            --fulcio-url "https://fulcio.sigstore.dev" \
            --rekor-url "https://rekor.sigstore.dev" \
            --type vuln \
            --predicate "$ATTESTATION" \
            "$IMAGE_REF"

      - name: Upload Grype SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: grype-results.sarif
          category: container

      - name: Verify Cosign attestation
        env:
          IMAGE_REF: ${{ matrix.image }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail

          cat > vulnz.cue <<'EOF'
          predicateType: "https://cosign.sigstore.dev/attestation/vuln/v1"
          EOF

          cosign verify-attestation \
            --type vuln \
            --policy vulnz.cue \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/$WORKFLOW_REF" \
            "$IMAGE_REF"
