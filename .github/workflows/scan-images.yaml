name: Scan Container Images

on:
  workflow_call:
    inputs:
      apps:
        description: JSON array of app names to scan (e.g. '["bazarr","radarr"]')
        type: string
        required: true
  schedule:
    - cron: "0 3 * * 0"

permissions: {}

jobs:
  prepare_scan_matrix:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_call'
    permissions:
      contents: read
      packages: read
    outputs:
      scan_matrix: ${{ steps.build_matrix.outputs.scan_matrix }}
    steps:
      - name: Checkout code
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build scan matrix
        id: build_matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPS: ${{ inputs.apps || '[]' }}
        with:
          script: |
            const path = require('path');

            const EVENT_NAME = process.env.EVENT_NAME;
            const OWNER      = process.env.OWNER;
            const semverRe   = /^\d+\.\d+\.\d+(-r\d+)?$/;

            let appNames;

            if (EVENT_NAME === 'workflow_call') {
              appNames = JSON.parse(process.env.APPS || '[]');
            } else {
              const fs = require('fs');
              const { execSync } = require('child_process');

              const apkoDirs = execSync(
                `find . -type f -name 'apko.yaml' ! -path '*/.*/*' -exec dirname {} \\;`,
                { encoding: 'utf8' }
              )
                .trim()
                .split('\n')
                .filter(Boolean)
                .map(d => d.replace(/^\.\//, ''))
                .sort();

              appNames = apkoDirs.map(d => path.basename(d));
            }

            if (appNames.length === 0) {
              core.warning('No apps to scan — empty matrix');
              core.setOutput('scan_matrix', '[]');
              return;
            }

            core.info(`Apps to look up: ${appNames.join(', ')}`);

            const include = [];

            for (const appName of appNames) {
              let versions;
              try {
                versions = await github.paginate(
                  'GET /users/{owner}/packages/{package_type}/{package_name}/versions',
                  { owner: OWNER, package_type: 'container', package_name: appName }
                );
              } catch (e) {
                if (e.status === 404) {
                  core.warning(`Package '${appName}' not found in GHCR — skipping`);
                } else {
                  core.warning(`GHCR API error for '${appName}': ${e.message} — skipping`);
                }
                continue;
              }

              const sorted = versions
                .filter(v => v.metadata?.container?.tags?.length)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              let latestTag    = null;
              let imageDigest  = null;

              for (const v of sorted) {
                const tag = v.metadata.container.tags.find(t => semverRe.test(t));
                if (tag && v.name?.startsWith('sha256:')) {
                  latestTag   = tag;
                  imageDigest = v.name;
                  break;
                }
              }

              if (!latestTag || !imageDigest) {
                core.warning(`No valid semver tag + digest found for '${appName}' — skipping`);
                continue;
              }

              core.info(`${appName}: ${latestTag} @ ${imageDigest}`);
              include.push({
                name:   appName,
                tag:    latestTag,
                digest: `ghcr.io/${OWNER}/${appName}@${imageDigest}`,
              });
            }

            const matrix = JSON.stringify(include);
            core.info(`Scan matrix (${EVENT_NAME}): ${matrix}`);
            core.setOutput('scan_matrix', matrix);

  grype:
    name: Setup Grype
    runs-on: ubuntu-24.04
    needs: prepare_scan_matrix
    if: needs.prepare_scan_matrix.outputs.scan_matrix != '[]'
    permissions: {}
    steps:
      - name: Compute cache key
        id: cache_key
        run: echo "key=grype-db-$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Grype database
        id: db-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache_key.outputs.key }}
          path: ~/.cache/grype/db
          lookup-only: true

      - name: Install Grype
        if: steps.db-restore.outputs.cache-hit != 'true'
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Update Grype database
        if: steps.db-restore.outputs.cache-hit != 'true'
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: $GRYPE_CMD db update

      - name: Cache Grype database
        if: steps.db-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache_key.outputs.key }}
          path: ~/.cache/grype/db

  vulnerability-scan:
    needs: [prepare_scan_matrix, grype]
    if: needs.prepare_scan_matrix.outputs.scan_matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.prepare_scan_matrix.outputs.scan_matrix) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Retrieve cache key
        id: cache_key
        run: echo "key=grype-db-$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Grype database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache_key.outputs.key }}
          path: ~/.cache/grype/db

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record scan start time
        id: scan-start
        run: echo "date=$(TZ=Zulu date '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Scan image with Grype
        id: grype-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.app.digest }}
          output-format: sarif
          output-file: grype-results-${{ matrix.app.name }}-${{ matrix.app.tag }}.sarif
          fail-build: false
          severity-cutoff: low

      - name: Attest Grype results with Cosign
        env:
          SARIF_FILE: ${{ steps.grype-scan.outputs.sarif }}
          SCAN_STARTED: ${{ steps.scan-start.outputs.date }}
          IMAGE_DIGEST: ${{ matrix.app.digest }}
          RUN_URI: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          ATTESTATION=$(mktemp)

          SCANNER_URI=$(jq -r '.runs[0].tool.driver.informationUri' "$SARIF_FILE")
          SCANNER_VERSION=$(jq -r '.runs[0].tool.driver.version' "$SARIF_FILE")

          echo "Grype URI:     $SCANNER_URI"
          echo "Grype version: $SCANNER_VERSION"

          jq -n \
            --arg uri        "$RUN_URI" \
            --arg event_id   "$RUN_ID" \
            --arg builder    "$WORKFLOW" \
            --arg s_uri      "$SCANNER_URI" \
            --arg s_ver      "$SCANNER_VERSION" \
            --arg started    "$SCAN_STARTED" \
            --arg finished   "$(TZ=Zulu date '+%Y-%m-%dT%H:%M:%SZ')" \
            --slurpfile sarif "$SARIF_FILE" \
            '{
              invocation: {
                parameters: null,
                uri:        $uri,
                event_id:   $event_id,
                "builder.id": $builder
              },
              scanner: {
                uri:     $s_uri,
                version: $s_ver,
                result:  $sarif[0]
              },
              metadata: {
                scanStartedOn:  $started,
                scanFinishedOn: $finished
              }
            }' > "$ATTESTATION"

          cosign attest --yes \
            --fulcio-url "https://fulcio.sigstore.dev" \
            --rekor-url  "https://rekor.sigstore.dev" \
            --type vuln \
            --predicate  "$ATTESTATION" \
            "$IMAGE_DIGEST"

      - name: Upload Grype SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: container:${{ matrix.app.name }}

      - name: Verify Cosign attestation
        env:
          IMAGE_DIGEST: ${{ matrix.app.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          cat > vulnz.cue <<EOF
          predicateType: "https://cosign.sigstore.dev/attestation/vuln/v1"
          EOF

          cosign verify-attestation \
            --type vuln \
            --policy vulnz.cue \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity   "https://github.com/$WORKFLOW_REF" \
            "$IMAGE_DIGEST" \
          || echo "WARNING: Could not verify attestation (is this a private image?)"
