name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - '**/tfplan'
  workflow_dispatch:

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  get-changes:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.map-folders.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: "**/tfplan"

      - name: Map Files to Folders
        id: map-folders
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const path = require('path');
            const files = ${{ steps.changed-files.outputs.changed_files }};
            const folders = [...new Set(files.map(file => path.dirname(file)))];
            console.log('Target folders for apply:', folders);
            core.setOutput('folders', JSON.stringify(folders));

  apply:
    needs: get-changes
    if: needs.get-changes.outputs.folders != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.get-changes.outputs.folders) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_wrapper: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Saved Plan
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init \
            -backend-config="../common_backend.conf" \
            -backend-config="key=${{ matrix.folder }}/terraform.tfstate"
          
          terraform apply -auto-approve tfplan
