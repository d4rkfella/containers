name: Terraform Plan

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover-terraform-configs:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-matrix.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-matrix
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const folders = fs.readdirSync('.').filter(f => fs.statSync(f).isDirectory());
            const imageFolders = folders.filter(f => fs.existsSync(path.join(f, 'main.tf')));
            core.setOutput('folders', JSON.stringify(imageFolders));

  plan:
    needs: discover-terraform-configs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.discover-terraform-configs.outputs.folders) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_wrapper: true

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init \
            -backend-config="../common_backend.conf" \
            -backend-config="key=${{ matrix.folder }}/terraform.tfstate"

      - name: Terraform Plan
        id: tf-plan
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan
          echo "exitcode=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Create Pull Request
        if: steps.tf-plan.outputs.exitcode == '2'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Terraform Plan: New changes detected in ${{ matrix.folder }}"
          title: "Terraform Plan: ${{ matrix.folder }}"
          body: |
            ### Scheduled plan detected changes for `${{ matrix.folder }}` 📖
            
            #### Plan Output:
            ```hcl
            ${{ steps.tf-plan.outputs.stdout }}
            ```
          branch: "terraform-plan/${{ matrix.folder }}"
          base: main
          add-paths: |
            ${{ matrix.folder }}/tfplan
