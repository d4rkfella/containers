name: Terraform Plan

on:
  schedule:
    - cron: '0 * * * *'
  push:
    paths:
      - '**/*.tf'
      - '**/apko.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-matrix.outputs.folders || steps.map-folders.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # CASE 1: Scheduled/Manual - Full Discovery
      - name: Full Scan Discovery
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: set-matrix
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const folders = fs.readdirSync('.', { recursive: true })
              .filter(f => f.endsWith('main.tf'))
              .map(f => path.dirname(f));
            const uniqueFolders = [...new Set(folders)].filter(f => f !== '.');
            core.setOutput('folders', JSON.stringify(uniqueFolders));

      # CASE 2: Push - Targeted Discovery
      - name: Get Changed Files
        if: github.event_name == 'push'
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |
            **/*.tf
            **/apko.yaml

      - name: Map Push Files to Folders
        if: github.event_name == 'push'
        id: map-folders
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const path = require('path');
            const files = ${{ steps.changed-files.outputs.changed_files || '[]' }};
            const folders = [...new Set(files.map(file => path.dirname(file)))].filter(f => f !== '.');
            core.setOutput('folders', JSON.stringify(folders));

  plan:
    needs: setup-matrix
    if: needs.setup-matrix.outputs.folders != '[]' && needs.setup-matrix.outputs.folders != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.setup-matrix.outputs.folders) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_wrapper: true

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init \
            -backend-config="../common_backend.conf" \
            -backend-config="key=${{ matrix.folder }}/terraform.tfstate"

      - name: Terraform Plan
        id: tf-plan
        working-directory: ${{ matrix.folder }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan > plan_output.txt
          EXIT_CODE=$?
          set -e
          echo "exitcode=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo $EXIT_CODE

          echo "PLAN_STDOUT<<EOF" >> $GITHUB_ENV
          head -c 50000 plan_output.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.tf-plan.outputs.exitcode == '2'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Terraform Plan: New changes detected in ${{ matrix.folder }}"
          title: "Terraform Plan: ${{ matrix.folder }}"
          body: |
            ### Plan detected changes for `${{ matrix.folder }}` 📖
            
            #### Plan Output:
            ```hcl
            ${{ env.PLAN_STDOUT }}
            ```
          branch: "terraform-plan/${{ matrix.folder }}"
          base: main
          add-paths: |
            ${{ matrix.folder }}/tfplan
