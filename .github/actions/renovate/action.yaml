name: 'Renovate'
description: >
  Resolves APK packages, regenerates locks, and opens PRs using the 
  apko-renovator Go tool.
branding:
  icon: refresh-cw
  color: blue

inputs:
  repo-token:
    description: 'GitHub token with contents:write and pull-requests:write permissions'
    required: true
  arch:
    description: 'Comma-separated list of architectures (e.g. x86_64,aarch64)'
    required: false
    default: "x86_64,aarch64"
  repositories:
    description: 'Newline-separated APK repository URLs'
    required: false
  keys:
    description: 'Newline-separated APK signing key URLs'
    required: false
  skip-verify:
    description: 'Set to "true" to disable APK index signature verification'
    required: false
    default: "false"
  workdir:
    description: 'Root directory to walk for apko.yaml files'
    required: false
    default: "."
  version:
    description: 'The version of the apko-renovator binary to install'
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Setup apko-renovator
      uses: d4rkfella/apko-renovator/setup-apko-renovator@5479c1d03517ef41ede7409aa79eebfd975fb96c # v0.2.2
      with:
        version: ${{ inputs.version }}
        token: ${{ inputs.repo-token }}

    - name: Run apko-renovator
      shell: bash
      env:
        INPUT_REPO_TOKEN: ${{ inputs.repo-token }}
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_REPOSITORIES: ${{ inputs.repositories }}
        INPUT_KEYS: ${{ inputs.keys }}
        INPUT_SKIP_VERIFY: ${{ inputs.skip-verify }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
        GITHUB_TOKEN: ${{ inputs.repo-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        apko-renovator
