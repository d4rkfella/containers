contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - vaultwarden=1.34.3-r0
work-dir: /
volumes: ["/data"]
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: ""
      shell: ""
  run-as: nonroot:nonroot
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  ROCKET_PROFILE: "release"
  ROCKET_ADDRESS: 0.0.0.0
  ROCKET_PORT: 80
  WEB_VAULT_FOLDER: "/usr/lib/vw_web_vault"
entrypoint:
  command: start.sh
