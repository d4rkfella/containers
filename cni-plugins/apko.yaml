contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - rsync
    - cni-plugins-bandwidth-compat=1.9.1-r0
    - cni-plugins-bridge-compat=1.9.1-r0
    - cni-plugins-dhcp-compat=1.9.1-r0
    - cni-plugins-dummy-compat=1.9.1-r0
    - cni-plugins-firewall-compat=1.9.1-r0
    - cni-plugins-host-device-compat=1.9.1-r0
    - cni-plugins-host-local-compat=1.9.1-r0
    - cni-plugins-ipvlan-compat=1.9.1-r0
    - cni-plugins-loopback-compat=1.9.1-r0
    - cni-plugins-macvlan-compat=1.9.1-r0
    - cni-plugins-portmap-compat=1.9.1-r0
    - cni-plugins-ptp-compat=1.9.1-r0
    - cni-plugins-sbr-compat=1.9.1-r0
    - cni-plugins-static-compat=1.9.1-r0
    - cni-plugins-tap-compat=1.9.1-r0
    - cni-plugins-tuning-compat=1.9.1-r0
    - cni-plugins-vlan-compat=1.9.1-r0
    - cni-plugins-vrf-compat=1.9.1-r0
accounts:
  run-as: root:root
environment:
  PATH: /bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
entrypoint:
  command: rsync -avL /opt/cni/bin/ /host/opt/cni/bin
